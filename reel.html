<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Swipe · Memory Sea · The Shoal</title><style>html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.4 system-ui,sans-serif;overscroll-behavior:none}#rl{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}#rl::-webkit-scrollbar{display:none}
.rc{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;user-select:none;-webkit-user-select:none}
.rc video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.tx{background:linear-gradient(#26204e,#f0966e 55%,#2c6f8f 70%,#d8bd92)}.tx.sg{background:radial-gradient(circle at 50% 42%,#ff9a3c 0,#7a2a14 22%,#120a16 55%,#05050c)}
.fc{position:absolute;left:50%;top:9%;width:min(72vw,52vh);aspect-ratio:1;margin-left:calc(min(72vw,52vh)/-2);border-radius:28%;overflow:hidden;animation:br 4s ease-in-out infinite,sw 7.5s ease-in-out infinite;box-shadow:0 0 60px #0006}
.fc img{width:100%;height:100%;object-fit:cover}.sg .fc{border-radius:50%;background:radial-gradient(#ffd27a,#ff7a1a 45%,#0000 70%);box-shadow:none;animation:fl 1.7s ease-in-out infinite alternate}
@keyframes br{50%{transform:scale(1.03) translateY(-4px)}}@keyframes sw{0%,100%{rotate:-1.2deg}50%{rotate:1.2deg}}@keyframes fl{from{opacity:.75;transform:scale(.96)}to{opacity:1;transform:scale(1.05)}}
.cp{position:relative;margin:0 12px 70px;padding:14px 16px;background:#0a0c19b0;border-radius:18px;font-size:clamp(17px,4.6vw,22px);font-weight:600;max-height:42vh;overflow:hidden}.cp .lb{font-size:13px;opacity:.85;margin-bottom:6px}
.rc.vid .cp{display:none}.sd{position:absolute;right:10px;top:36%;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:2}.sd button{background:#0006;border:0;color:#fff;font-size:26px;width:50px;height:50px;border-radius:50%}
.sd .on{color:#f91880}.bg{position:absolute;left:50%;top:45%;font-size:110px;color:#f91880;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;z-index:3}.bg.go{animation:pop .7s ease-out}
@keyframes pop{30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#tb{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:18px;padding:10px;z-index:5;background:linear-gradient(#000a,#0000);font-weight:700}#tb a,#tb button{color:#fffb;background:none;border:0;font:700 15px system-ui;text-decoration:none}#tb .on{color:#fff;box-shadow:inset 0 -2px #fff}
.ft2{position:absolute;bottom:14px;width:100%;text-align:center;font-size:11px;opacity:.6}</style><nav id=tb><a href="memsea.html">‹ Memory Sea</a><button data-t=foryou>For you</button><button data-t=latest>Latest</button></nav><div id=rl></div><script>
let LK={},TAB='latest';try{LK=JSON.parse(localStorage.getItem('msLikes')||'{}');const t=localStorage.getItem('msTab');if(t)TAB=t}catch(x){}
const FACE={"umasato": "avatars/umasato-320.jpg", "mckenna": "avatars/mckenna-320.jpg", "ora": "avatars/ora-320.jpg", "clarissa": "avatars/clarissa-320.jpg", "surf-gil": "avatars/surf-gil-320.jpg", "cleo": "avatars/cleo-320.jpg", "lulu": "avatars/lulu-320.jpg", "thoth": "avatars/thoth-320.jpg", "javi": "avatars/javi-320.jpg", "rust": "avatars/rust-320.jpg", "aureliobrisa": "avatars/aureliobrisa-320.jpg", "dara": "avatars/dara-320.jpg", "nina": "avatars/nina-320.jpg", "yara": "avatars/yara-320.jpg", "fabian": "avatars/fabian-320.jpg", "finn": "avatars/finn-320.jpg", "deida": "avatars/deida-320.jpg", "surf-coco": "avatars/surf-coco-320.jpg", "valentina": "avatars/valentina-320.jpg", "dana": "avatars/dana-320.jpg", "vee": "avatars/vee-320.jpg", "fenna": "avatars/fenna-320.jpg", "marisol": "avatars/marisol-320.jpg", "chris": "avatars/chris-320.jpg", "tobin": "avatars/tobin-320.jpg", "david": "avatars/david-320.jpg", "noemiarenas": "avatars/noemiarenas-320.jpg", "perrin": "avatars/perrin-320.jpg", "surfista": "avatars/surfista-320.jpg", "surf-vera": "avatars/surf-vera-320.jpg", "lalo": "avatars/lalo-320.jpg", "kiki": "avatars/kiki-320.jpg", "sky": "avatars/sky.png"},F=d=>({tag:d.tag||'',who:d.who||'',kind:d.kind||'old',rp:d.rp||'0'});let L=null,CL=[];
function score(d){const l=Object.values(LK);if(!l.length)return 0;const f=F(d);let s=0;l.forEach(x=>{s+=(x.tag==f.tag)*3+(x.who==f.who)*2+(x.kind==f.kind)*1.5+(x.rp==f.rp)*.5});return s/l.length}
function save(){try{localStorage.setItem('msLikes',JSON.stringify(LK));localStorage.setItem('msTab',TAB)}catch(x){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function MS(x){L=x;draw()}
function draw(){if(!L)return;const t=document.createElement('template');t.innerHTML=L.rows;
let bs=[...t.content.querySelectorAll('.blk')].map(b=>({...b.dataset,q:b.querySelector('q:not(.who)')?.textContent||'',sg:b.querySelector('.sng')?.innerHTML||'',av:b.querySelector('.av img')?.getAttribute('src')||''}));
const by=new Map(bs.map(b=>[b.h,b]));const cl=CL.map(c=>({...(by.get(c.h)||{n:c.n,h:c.h,day:c.day,who:c.who,name:c.name,tag:c.tag,kind:c.kind,rp:'0'}),clip:c.file,po:c.poster||''}));const ch=new Set(CL.map(c=>c.h));
bs=bs.filter(b=>!ch.has(b.h));if(TAB=='foryou')bs.sort((a,b)=>(score(b)-score(a))||(b.n-a.n));
const o=[];let i=0,j=0;while(i<cl.length||j<bs.length){if(i<cl.length)o.push(cl[i++]);for(let k=0;k<3&&j<bs.length;k++)o.push(bs[j++])}
const R=document.getElementById('rl');R.innerHTML=o.map(card).join('');const q=+(new URLSearchParams(location.search).get('c')||0);if(q)R.scrollTop=q*R.clientHeight;document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t==TAB));wire()}
function card(d){const lb=(d.kind=='song'?'♪ song':'@'+esc(d.who))+' · '+esc(d.tag)+' · Day '+esc(d.day);const hb='<div class=sd><button class="hb'+(LK[d.h]?' on':'')+'">'+(LK[d.h]?'♥':'♡')+'</button>'+(d.clip?'<button class=mu>🔇</button>':'')+'</div><div class=bg>♥</div>';
const dd=' data-h="'+esc(d.h)+'" data-f=\''+esc(JSON.stringify(F(d)))+'\'';
if(d.clip)return '<section class="rc vid"'+dd+'><video data-src="'+esc(d.clip)+'"'+(d.po?' poster="'+esc(d.po)+'"':'')+' preload=none muted playsinline loop></video>'+hb+'</section>';
const fs=FACE[d.who]||d.av;const fc=d.kind=='song'?'<div class=fc></div>':fs?'<div class=fc><img src="'+esc(fs)+'" alt="" loading=lazy></div>':'';
return '<section class="rc tx'+(d.kind=='song'?' sg':'')+'"'+dd+'>'+fc+'<div class=cp><div class=lb>'+lb+'</div>'+(d.kind=='song'?'<i>'+d.sg+'</i>':esc(d.q))+'</div>'+hb+'<div class=ft2>The Shoal · La Ola Studios</div></section>'}
let IO;function wire(){IO&&IO.disconnect();IO=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;
if(e.isIntersecting&&e.intersectionRatio>.6){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{})}else if(!v.paused)v.pause()}),{threshold:[0,.6]});
document.querySelectorAll('.rc').forEach(c=>{IO.observe(c);let tm=0;c.onclick=ev=>{if(ev.target.closest('.sd'))return;if(tm){clearTimeout(tm);tm=0;like(c,true)}else tm=setTimeout(()=>{tm=0;mute(c)},280)};
c.querySelector('.hb').onclick=()=>like(c,false);const m=c.querySelector('.mu');if(m)m.onclick=()=>mute(c)})}
function like(c,dbl){const k=c.dataset.h;if(dbl){LK[k]=JSON.parse(c.dataset.f);const g=c.querySelector('.bg');g.classList.remove('go');void g.offsetWidth;g.classList.add('go')}else if(LK[k])delete LK[k];else LK[k]=JSON.parse(c.dataset.f);
save();const b=c.querySelector('.hb');b.textContent=LK[k]?'♥':'♡';b.classList.toggle('on',!!LK[k])}
function mute(c){const v=c.querySelector('video');if(!v)return;v.muted=!v.muted;if(!v.muted)v.play().catch(()=>{});c.querySelector('.mu').textContent=v.muted?'🔇':'🔊'}
document.querySelectorAll('#tb button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;save();draw();document.getElementById('rl').scrollTop=0});
addEventListener('keydown',e=>{const R=document.getElementById('rl');if(e.key=='ArrowDown'||e.key=='ArrowUp')R.scrollBy({top:(e.key=='ArrowDown'?1:-1)*innerHeight,behavior:'smooth'})});
const V=Math.floor(Date.now()/300000);fetch('reels/index.json?v='+V).then(r=>r.ok?r.json():{clips:[]}).catch(()=>({clips:[]})).then(j=>{CL=j.clips||[]}).finally(()=>{const s=document.createElement('script');s.src='memsea-latest.js?v='+V;document.body.appendChild(s)});
</script>
